[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for the Financial Fraud Investigation RAG system"
readme = "README.md"
authors = [
    { name = "KripaGurung", email = "krepagurung@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"