[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for the Financial Fraud Investigation RAG system"
readme = "README.md"
authors = [
    { name = "KripaGurung", email = "krepagurung@gmail.com" },
    { name = "bibikashrt", email = "bibikashrestha17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]